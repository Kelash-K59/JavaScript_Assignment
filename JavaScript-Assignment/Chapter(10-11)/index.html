<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter (10-11)</title>
  </head>
  <body>
    <script>
      /* Q1. Write a program to take “city” name as input from user. If 
user enters “Karachi”, welcome the user like this: 
“Welcome to city of lights” */
      var city = prompt("Enter your city:");

      if (city === "Karachi") {
        alert("Welcome to city of lights");
      }

      /* Q2. Write a program to take “gender” as input from user. If the
user is male, give the message: Good Morning Sir. If the 
user is female, give the message: Good Morning Ma’am.*/
      var gender = prompt("Enter your gender:");

      if (gender === "male") {
        alert("Good Morning Sir.");
      } else if (gender === "female") {
        alert("Good Morning Ma’am.");
      }

      /* Q3. Write a program to take input color of road traffic signal 
from the user & show the message according to the table:*/
      var signal = prompt("Enter traffic signal color:");

      if (signal === "red") {
        alert("Must Stop");
      } else if (signal === "yellow") {
        alert("Ready to move");
      } else if (signal === "green") {
        alert("Move now");
      }

      /* Q4. Write a program to take input remaining fuel in car (in 
litres) from user. If the current fuel is less than 0.25litres, 
show the message “Please refill the fuel in your car"*/
      var fuel = Number(prompt("Enter remaining fuel in litres:"));

      if (fuel < 0.25) {
        alert("Please refill the fuel in your car");
      }

      /* Q5. Run this script, & check whether alert message would be
displayed or not. Record the outputs.*/
      var a = 4;
      if (++a === 5) {
        alert("given condition for variable a is true");
      }
      var b = 82;
      if (b++ === 83) {
        alert("given condition for variable b is true");
      }
      var c = 12;
      if (c++ === 13) {
        alert("condition 1 is true");
      }
      if (c === 13) {
        alert("condition 2 is true");
      }
      if (++c < 14) {
        alert("condition 3 is true");
      }
      if (c === 14) {
        alert("condition 4 is true");
      }
      var materialCost = 20000;
      var laborCost = 2000;
      var totalCost = materialCost + laborCost;
      if (totalCost === laborCost + materialCost) {
        alert("The cost equals");
      }
      if (true) {
        alert("True");
      }
      if (false) {
        alert("False");
      }
      // User Input & Conditional Statement | JAVASCRIPT
      if ("car" < "cat") {
        alert("car is smaller than cat");
      }

      /* Q6. Write a program to take input the marks obtained in three
subjects & total marks. Compute & show the resulting
percentage on your page. Take percentage & compute 
grade as per following table and Show the total marks, marks obtained, percentage, grade &
remarks like:*/
      var subject1 = Number(prompt("Enter marks obtained in subject 1:"));
      var subject2 = Number(prompt("Enter marks obtained in subject 2:"));
      var subject3 = Number(prompt("Enter marks obtained in subject 3:"));

      var totalMarks = 300;

      var marksObtained = subject1 + subject2 + subject3;

      var percentage = (marksObtained / totalMarks) * 100;

      var grade;
      var remarks;

      if (percentage >= 80) {
        grade = "A-one";
        remarks = "Excellent";
      } else if (percentage >= 70) {
        grade = "A";
        remarks = "Good";
      } else if (percentage >= 60) {
        grade = "B";
        remarks = "You need to improve";
      } else {
        grade = "Fail";
        remarks = "Sorry";
      }

      document.write("<h1>Marks Sheet</h1>");
      document.write("Total marks : " + totalMarks + "<br>");
      document.write("Marks obtained : " + marksObtained + "<br>");
      document.write("Percentage : " + percentage + "%<br>");
      document.write("Grade : " + grade + "<br>");
      document.write("Remarks : " + remarks);

      /* Q7. Guess game:
Store a secret number (ranging from 1 to 10) in a variable.
Prompt user to guess the secret number.
a. If user guesses the same number, show “Bingo! Correct
answer”.
b. If the guessed number +1 is the secret number, show
“Close enough to the correct answer”.*/
      var secretNumber = 7;

      var userGuess = Number(prompt("Guess the secret number (1-10):"));

      if (userGuess === secretNumber) {
        alert("Bingo! Correct answer");
      } else if (userGuess + 1 === secretNumber) {
        alert("Close enough to the correct answer");
      }

      /* Q8. Write a program to check whether the given number is
divisible by 3. Show the message to the user if the number 
is divisible by 3.*/
      var number = Number(prompt("Enter a number:"));

      if (number % 3 === 0) {
        alert("The number is divisible by 3");
      }

      /* Q9. Write a program that checks whether the given input is an
even number or an odd number.*/
      var number = Number(prompt("Enter a number:"));

      if (number % 2 === 0) {
        alert("The number is even");
      } else {
        alert("The number is odd");
      }

      /* Q10. Write a program that takes temperature as input and 
shows a message based on following criteria
a. T > 40 then “It is too hot outside.”
b. T > 30 then “The Weather today is Normal.”
c. T > 20 then “Today’s Weather is cool.”
d. T > 10 then “OMG! Today’s weather is so Cool.”*/
      var temperature = Number(prompt("Enter temperature:"));

      if (temperature > 40) {
        alert("It is too hot outside.");
      } else if (temperature > 30) {
        alert("The Weather today is Normal.");
      } else if (temperature > 20) {
        alert("Today's Weather is cool.");
      } else if (temperature > 10) {
        alert("OMG! Today's weather is so Cool.");
      }

      /* Q11. Write a program to create a calculator for +,-,*, / & % 
using if statements. Take the following input:
a. First number
b. Second number
c. Operation (+, -, *, /, %)
Compute & show the calculated result to user.*/
      var number1 = Number(prompt("Enter first number:"));
      var number2 = Number(prompt("Enter second number:"));
      var operation = prompt("Enter operation (+, -, *, /, %):");

      var result;

      if (operation === "+") {
        result = number1 + number2;
      } else if (operation === "-") {
        result = number1 - number2;
      } else if (operation === "*") {
        result = number1 * number2;
      } else if (operation === "/") {
        result = number1 / number2;
      } else if (operation === "%") {
        result = number1 % number2;
      } else {
        result = "Invalid operation";
      }

      alert("Result: " + result);
    </script>
  </body>
</html>
