<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter 01</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        text-align: center;
      }
      h1 {
        color: #2a7ae2;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>My Website</h1>
    <p>Click the button below.</p>
    <button onclick="alert('Button clicked!')">Click Me</button>

    <script>
      /* Q1. Write a script to greet your website visitor using JS alert 
box.*/
      alert("Welcome to my website!");

      /* Q2. Write a script to display following message on your web 
page:*/
      alert("Error! Please enter a valid password.");

      /* Q3. Write a script to display following message on your web 
page: (Hint : Use line break)*/
      alert("Welcome to JS Land...\nHappy Coding!");

      /* Q4. Write a script to display following messages in sequence:*/
      alert("Welcome to JS Land...");
      alert("Happy Coding!");

      /* Q5. Generate the following message through browser’s 
developer console:*/
      alert("Hello... I can run JS through my web browser's console");

      /* Q6. Make use of alerts in your new/existing HTML & CSS 
project.*/
      alert("Welcome to my website!");

      /* Q7. Practice placement of element in 
following sections of your project in exercise 6:*/
      /*a. Head */
      alert("Script in HEAD");

      /*b. Body (before your page’s HTML)*/
      alert("Script in BODY (before HTML)");

      /*c. Body (inside your page’s HTML)*/
      alert("Script in BODY (inside HTML)");

      /*d. Body (after your page’s HTML) */
      alert("Script in BODY (after HTML)");
    </script>
  </body>
</html>
