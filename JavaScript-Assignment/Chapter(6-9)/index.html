<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter (06,07,08,09)</title>
  </head>
  <body>
    <script>
      /* Q1. Write a program to take a number in a variable, do the
required arithmetic to display the following result in your
browser: */
      var a = 10;

      document.write("The value of a is: " + a + "<br><br>");

      document.write("The value of ++a is: " + ++a + "<br>");
      document.write("Now the value of a is: " + a + "<br><br>");

      document.write("The value of a++ is: " + a++ + "<br>");
      document.write("Now the value of a is: " + a + "<br><br>");

      document.write("The value of --a is: " + --a + "<br>");
      document.write("Now the value of a is: " + a + "<br><br>");

      document.write("The value of a-- is: " + a-- + "<br>");
      document.write("Now the value of a is: " + a + "<br>");

      /*  Q2. What will be the output in variables a, b & result after
execution of the following script:
var a = 2, b = 1;
var result = --a - --b + ++b + b--;
Explain the output at each stage:
--a;
--a - --b;
--a - --b + ++b;
--a - --b + ++b + b--;  */

      var a = 2,
        b = 1;

      var result = --a - --b + ++b + b--;

      document.write("a is: " + a + "<br>");
      document.write("b is: " + b + "<br>");
      document.write("result is: " + result);

      /* Q3. Write a program that takes input a name from user & 
greet the user. */

      var userName = prompt("Enter your name:");

      alert("Hello " + userName);

      /* Q4. Write a program to take input a number from user & 
display it’s multiplication table on your browser. If user 
does not enter a new number, multiplication table of 5 
should be displayed by default. */
      var number = prompt("Enter a number:");

      if (number === "") {
        number = 5;
      }

      document.write("<h2>Multiplication Table of " + number + "</h2>");

      document.write(number + " x 1 = " + number * 1 + "<br>");
      document.write(number + " x 2 = " + number * 2 + "<br>");
      document.write(number + " x 3 = " + number * 3 + "<br>");
      document.write(number + " x 4 = " + number * 4 + "<br>");
      document.write(number + " x 5 = " + number * 5 + "<br>");
      document.write(number + " x 6 = " + number * 6 + "<br>");
      document.write(number + " x 7 = " + number * 7 + "<br>");
      document.write(number + " x 8 = " + number * 8 + "<br>");
      document.write(number + " x 9 = " + number * 9 + "<br>");
      document.write(number + " x 10 = " + number * 10 + "<br>");

      /* Q5. Take
a) Take three subjects name from user and store them in 3 
different variables.
b) Total marks for each subject is 100, store it in another 
variable.
c) Take obtained marks for first subject from user and 
stored it in different variable.
d) Take obtained marks for remaining 2 subjects from user 
and store them in variables.
e) Now calculate total marks and percentage and show the 
result in browser like this.(Hint: user table) */

      var subject1 = prompt("Enter first subject name:");
      var subject2 = prompt("Enter second subject name:");
      var subject3 = prompt("Enter third subject name:");

      var totalMarksEach = 100;

      var marks1 = Number(prompt("Enter marks obtained in " + subject1 + ":"));
      var marks2 = Number(prompt("Enter marks obtained in " + subject2 + ":"));
      var marks3 = Number(prompt("Enter marks obtained in " + subject3 + ":"));

      var totalMarks = totalMarksEach * 3;
      var marksObtained = marks1 + marks2 + marks3;
      var percentage = (marksObtained / totalMarks) * 100;

      document.write("<h1>Marks Sheet</h1>");

      document.write("<table border='1' cellpadding='10'>");

      document.write("<tr>");
      document.write("<th>Subject</th>");
      document.write("<th>Total Marks</th>");
      document.write("<th>Marks Obtained</th>");
      document.write("</tr>");

      document.write("<tr>");
      document.write("<td>" + subject1 + "</td>");
      document.write("<td>100</td>");
      document.write("<td>" + marks1 + "</td>");
      document.write("</tr>");

      document.write("<tr>");
      document.write("<td>" + subject2 + "</td>");
      document.write("<td>100</td>");
      document.write("<td>" + marks2 + "</td>");
      document.write("</tr>");

      document.write("<tr>");
      document.write("<td>" + subject3 + "</td>");
      document.write("<td>100</td>");
      document.write("<td>" + marks3 + "</td>");
      document.write("</tr>");

      document.write("</table>");

      document.write("<br>Total Marks: " + totalMarks);
      document.write("<br>Marks Obtained: " + marksObtained);
      document.write("<br>Percentage: " + percentage + "%");
    </script>
  </body>
</html>
